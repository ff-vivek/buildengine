name: buildbeacon
description: "**BuildEngine is your personal Flutter web build factory! Upload your project, pick your settings, and get a perfectly packaged web build ready for deployment – all with a friendly, intuitive interface.**"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.0.0
  file_picker: '>=8.1.2'
  freezed_annotation: ^3.0.0
  json_annotation: ^4.0.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  freezed: ^3.0.0
  json_serializable: ^6.0.0
  build_runner: ^2.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
